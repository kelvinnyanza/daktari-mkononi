packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# The monorepo runs two React copies on purpose: apps/mobile is React 19.1
# (React Native 0.81 / Expo SDK 54, which pins React exactly) and apps/web is
# React 19.2 (Next 15.5). Same major, but each app has its own @types/react
# (19.1.x vs 19.2.x), so the hoisting problem below still applies.
#
# The packages below ship .d.ts files that import `react` but declare no
# dependency on @types/react, so they used to resolve it through pnpm's single
# hoisted copy. Whenever the two apps' @types/react differ, whichever copy
# landed in that shared slot leaks into the other app — "Stack cannot be used
# as a JSX component" in mobile, or the mirror-image failure in web.
#
# Declaring @types/react a peer makes pnpm install these packages once per
# @types/react version and resolve each app's copy from the app itself. The peer is
# deliberately NOT optional: an optional peer is skipped when unsatisfied,
# which puts us straight back on the hoisted fallback.
#
# Note this must be fixed at the dependency graph, not in tsconfig `paths` —
# jest-expo turns mobile's `paths` into runtime moduleNameMapper entries, so a
# type-only pin there breaks the mobile test resolver.
packageExtensions:
  "@tanstack/react-query":
    peerDependencies:
      "@types/react": "*"
  "@react-navigation/native":
    peerDependencies:
      "@types/react": "*"
  "@react-navigation/core":
    peerDependencies:
      "@types/react": "*"
  "@react-navigation/elements":
    peerDependencies:
      "@types/react": "*"
  "@react-navigation/bottom-tabs":
    peerDependencies:
      "@types/react": "*"
  "@react-navigation/native-stack":
    peerDependencies:
      "@types/react": "*"
  expo-router:
    peerDependencies:
      "@types/react": "*"
