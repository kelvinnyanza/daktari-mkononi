packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# packageExtensions live in the ROOT package.json ("pnpm.packageExtensions"),
# not here: this repo pins pnpm 9 (packageManager), and pnpm 9 does not read
# packageExtensions from pnpm-workspace.yaml (that arrived in pnpm 10). The
# block that used to sit here was silently ignored — the lockfile carried no
# packageExtensionsChecksum and none of the extended peers.
#
# Why the extensions exist. The monorepo runs two React copies on purpose:
# apps/mobile is React 19.1 (React Native 0.81 / Expo SDK 54, which pins React
# exactly) and apps/web is React 19.2 (Next 15.5), each with its own
# @types/react. A package that imports `react` (or ships .d.ts importing it)
# without declaring it gets no pnpm link and resolves through the single
# hoisted fallback (.pnpm/node_modules/react) — whichever app's copy landed
# there leaks into the other app:
#   - types: "Stack cannot be used as a JSX component" (@tanstack/react-query,
#     @react-navigation/*, expo-router → declared @types/react peers);
#   - runtime: two Reacts in the mobile bundle, "Invalid hook call" /
#     "useState of null" (@daily-co/react-native-daily-js and
#     @daily-co/react-native-webrtc import react with no peer → declared react
#     peers). apps/mobile/metro.config.js also pins react/* to the app's copy.
#
# Peers are deliberately NOT optional: an optional peer is skipped when
# unsatisfied, which puts us straight back on the hoisted fallback.
#
# Fix this at the dependency graph, not in tsconfig `paths` — jest-expo turns
# mobile's `paths` into runtime moduleNameMapper entries, so a type-only pin
# there breaks the mobile test resolver.
