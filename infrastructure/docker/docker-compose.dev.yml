name: daktari-mkononi-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: daktari-postgres
    environment:
      POSTGRES_USER: daktari
      POSTGRES_PASSWORD: daktari
      POSTGRES_DB: daktari_mkononi
    ports:
      - "5432:5432" # matches DATABASE_URL in .env.example
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daktari -d daktari_mkononi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: daktari-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379" # matches REDIS_URL in .env.example
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
